<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bookwheel</title>
    <meta name="description" content="Bookwheel – euer Buchclub: Regal füllen, am Rad drehen, gemeinsam lesen und bewerten." />
    <meta name="theme-color" content="#f3ecdf" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16120f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bookwheel:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('bookwheel:lang') || ((navigator.language || '').toLowerCase().indexOf('de') === 0 ? 'de' : 'en');
        document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Bookwheel needs JavaScript. / Bookwheel braucht JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
